databases:
  - name: mysitedb
    plan: free
    databaseName: mysite
    user: mysite

services:
  
  - type: web
    plan: free
    name: mysite
    runtime: python
    rootDirectory: backend_django
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

  - type: web
    name: catalogo-plantas-frontend
    runtime: static
    plan: free
    rootDirectory: PRACTICA03_CATALOGO_PLANTAS
    buildCommand: 'npm install && npm run build'
    publishDir: 'dist'
    routes:
      - type: rewrite
        source: '/*'
        destination: '/index.html'