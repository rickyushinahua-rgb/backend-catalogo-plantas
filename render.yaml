databases:
  - name: mysitedb
    plan: free
    databaseName: mysite
    user: mysite

services:
  # --- BACKEND (DJANGO) ---
  - type: web
    plan: free
    name: mysite
    runtime: python
    rootDir: backend_django       # <-- Ahora sí, Render entrará aquí para Django
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

  # --- FRONTEND (REACT) ---
  - type: web
    name: catalogo-plantas-frontend
    runtime: static
    plan: free
    rootDir: frontend_react       # <-- Render entrará aquí para React
    buildCommand: 'npm install && npm run build'
    publishDir: 'dist'            # <-- Sintaxis de Blueprint corregida
    routes:
      - type: rewrite
        source: '/*'
        destination: '/index.html'