databases:
  - name: mysitedb
    plan: free
    databaseName: mysite
    user: mysite

services:
  # --- BACKEND (DJANGO) ---
  - type: web
    plan: free
    name: mysite
    runtime: python
    rootDirectory: backend_django  # <-- ¡IMPORTANTE! Dile a Render dónde está Django
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

  # --- FRONTEND (REACT) ---
  - type: web
    name: catalogo-plantas-frontend
    runtime: static
    plan: free
    rootDirectory: PRACTICA03_CATALOGO_PLANTAS # <-- ¡CAMBIA ESTO por el nombre real de tu carpeta de React!
    buildCommand: 'npm install && npm run build'
    publishDir: 'dist'
    routes:
      - type: rewrite
        source: '/*'
        destination: '/index.html'