databases:
  - name: mysitedb
    plan: free
    databaseName: mysite
    user: mysite

services:
  # --- BACKEND (DJANGO) ---
  - type: web
    plan: free
    name: mysite
    runtime: python
    # NOTA: No ponemos 'rootDir' aquí porque tu Django está suelto en la raíz del proyecto
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mysitedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

  # --- FRONTEND (REACT) ---
  - type: web
    name: catalogo-plantas-frontend
    runtime: static
    plan: free
    rootDir: frontend_react       # Corrección: Sintaxis exacta y nombre real de tu carpeta
    buildCommand: 'npm install && npm run build'
    staticPublishDir: 'dist'      # Corrección: Sintaxis exacta para el directorio de publicación
    routes:
      - type: rewrite
        source: '/*'
        destination: '/index.html'